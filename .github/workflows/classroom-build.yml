# Builds our custom Hubs client image whenever hubs/ changes on main and publishes it to
# ghcr.io/<owner>/classroom-hubs. Uses the built-in GITHUB_TOKEN, so no personal access token is needed.
# The CE deployment points its Hubs image at  ghcr.io/<owner>/classroom-hubs:latest
name: classroom-build

on:
  push:
    branches: [main]
    paths: ["hubs/**", "!hubs/**.md", ".github/workflows/classroom-build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: classroom-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/classroom-hubs" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: hubs
          file: hubs/RetPageOriginDockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
