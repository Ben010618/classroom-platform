name: asset-budget

on:
  pull_request:
    paths: ["assets/**", "tools/asset-budget/**"]
  push:
    branches: [main]
    paths: ["assets/**", "tools/asset-budget/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: tools/asset-budget
      - run: npm test
        working-directory: tools/asset-budget
      - name: Check assets
        run: |
          if [ -d assets ]; then node tools/asset-budget/check.mjs assets; else echo "no assets/ yet"; fi
