<!doctype html><meta charset="utf-8"><title>char test</title>
<style>html,body{margin:0;height:100%;background:#9cc}canvas{display:block}</style><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="avatar.js"></script><script src="character.js"></script>
<script>
// Dev page: every body/outfit/hair/action in one row. Hash: #close (faces) #back #side, and #t=<seconds> to freeze time.
(async () => {
  const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(1280, 720); r.outputEncoding = THREE.sRGBEncoding; r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
  const s = new THREE.Scene(); s.background = new THREE.Color(0xbfd8e6);
  s.add(new THREE.HemisphereLight(0xffffff, 0x8a8170, 0.9)); const d = new THREE.DirectionalLight(0xfff2dc, 1.0); d.position.set(3, 6, -4); s.add(d);
  const g = new THREE.Mesh(new THREE.PlaneGeometry(30, 30).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xc8c2b4 })); s.add(g);
  const h = location.hash;
  const cam = new THREE.PerspectiveCamera(35, 1280 / 720, 0.1, 100);
  const focus = +(h.match(/f=(-?[\d.]+)/) || [0, 0])[1];
  if (h.includes("close")) { cam.position.set(focus, 1.58, -1.25); cam.lookAt(focus, 1.5, 0); }
  else if (h.includes("back")) { cam.position.set(0, 1.6, 8.5); cam.lookAt(0, 1.0, 0); }
  else if (h.includes("side")) { cam.position.set(-9, 1.4, -2); cam.lookAt(0, 0.9, 0); }
  else { cam.position.set(0, 1.5, -9.5); cam.lookAt(0, 0.95, 0); }
  const chair = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), new THREE.MeshStandardMaterial({ color: 0x8a5a33 }));
  await Characters.load(THREE, "assets/characters/", "t" + Date.now());
  const looks = [
    [{ name: "Ana", skin: "a", hair: "long", hairColor: "black", outfit: "blouse", body: "female", bag: true }, "walk"],
    [{ name: "Ben", skin: "c", hair: "short", hairColor: "black", outfit: "polo", body: "male", bag: true }, "idle"],
    [{ name: "Carla", skin: "d", hair: "bun", hairColor: "brown", outfit: "pe", body: "female" }, "run"],
    [{ name: "Dino", skin: "e", hair: "buzz", hairColor: "black", outfit: "casual", body: "male" }, "hand"],
    [{ name: "Ms. Santos", skin: "b", hair: "bun", hairColor: "auburn", outfit: "teacher", body: "female" }, "talk", { role: "teacher" }],
    [{ name: "Mia", skin: "b", hair: "ponytail", hairColor: "brown", outfit: "blouse", body: "female", bag: true }, "sit"],
    [{ name: "Leo", skin: "a", hair: "short", hairColor: "brown", outfit: "polo", body: "male" }, "wave"],
    [{ name: "Joy", skin: "c", hair: "short", hairColor: "black", outfit: "polo", body: "female" }, "clap"]
  ];
  const n = looks.length;
  const chars = looks.map(([look, act, o], i) => {
    const c = Characters.create(THREE, look, o || {}); c.position.set((i - (n - 1) / 2) * 1.3, 0, 0); s.add(c);
    c.userData.act = act;
    if (act === "walk") c.userData.setMove(1.4, false); if (act === "run") c.userData.setMove(5.5, false);
    if (act === "hand") c.userData.setHand(true); if (act === "talk") c.userData.setTalking(1);
    if (act === "sit") { c.userData.setSitting(true); const ch = chair.clone(); ch.position.set(c.position.x, 0.225, 0.12); s.add(ch); }
    return c;
  });
  const freeze = h.match(/t=([\d.]+)/);
  let last = performance.now(), simT = 0;
  const step = dt => { simT += dt; chars.forEach(c => { if ((c.userData.act === "wave" || c.userData.act === "clap") && (simT % 2.4) < dt) c.userData.emote(c.userData.act); c.userData.tick(dt); }); };
  if (freeze) for (let k = 0; k < +freeze[1] * 30; k++) step(1 / 30);
  (function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; if (!freeze) step(dt); r.render(s, cam);
    window.__frames = (window.__frames || 0) + 1; window.__info = r.info.render.triangles; requestAnimationFrame(loop); })(last);
  document.title = "OK";
})().catch(e => { document.title = "ERR " + e.message; console.error(e); });
</script>
